# Build of the "Finamp SDM" personal fork.
# Each push of a tag sdm-<version> carries: the upstream Finamp release + the personal patches as commits
# + this workflow + SDM-BUILD.md + .sdm/build.json (version name/number, upstream tag, commit count).
#   android: release APK (arm64) signed with a throwaway key generated in this job (not meant for
#            installation); the log and a status file are attached to the release.
#   windows: after a good Android build; attaches finamp-sdm-<version>-windows-x64.zip (+ .sha256)
#            and marks the release as the latest one.
name: SDM build
on:
  push:
    tags: ['sdm-[0-9]*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ok: ${{ steps.build.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - name: Hygiene check (no secrets / private addresses in the personal commits)
        shell: bash
        run: |
          n=$(jq -r .our_commits .sdm/build.json)
          pat='-----BEGIN [A-Z ]*PRIVATE KEY-----|\b(ghp|gho|ghs)_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|\bAKIA[0-9A-Z]{16}\b|\b[0-9]{8,10}:[A-Za-z0-9_-]{30,}\b|(^|[^0-9.])(10\.[0-9]{1,3}|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]{1,3}\.[0-9]{1,3}([^0-9.]|$)'
          if { git log -"$n" --format='%an %ae %cn %ce %B'; git diff "HEAD~$n" HEAD | grep '^+' ; } | grep -E -q "$pat"; then
            echo "Hygiene check failed: a secret-looking value or private address is in the personal commits"; exit 1
          fi
          echo "hygiene check: clean ($n personal commits)"
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Free up disk space
        run: sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/share/powershell
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - name: Analyze + tests (personal files only)
        id: tests
        shell: bash
        run: |
          set -o pipefail
          # integration_test (dev dependency) ends up in the release GeneratedPluginRegistrant but not in
          # the release classpath -> javac error. Integration tests are not run here: drop it.
          sed -i '/^  integration_test:/,/^    sdk: flutter/d' pubspec.yaml
          grep -q "^  integration_test:" pubspec.yaml && { echo "could not drop integration_test"; exit 1; }
          {
            flutter pub get
            # whole lib: compile errors in patched upstream files fail here (~3 min) instead of in Gradle
            flutter analyze --no-fatal-infos --no-fatal-warnings lib $(ls -d test/sdm 2>/dev/null || true)
            if [ -d test/sdm ]; then flutter test test/sdm; fi
          } 2>&1 | tee sdm-tests.log
      - name: Build APK (throwaway signing key)
        id: build
        shell: bash
        run: |
          set -o pipefail
          BN=$(jq -r .build_name .sdm/build.json); BNUM=$(jq -r .build_number .sdm/build.json)
          keytool -genkeypair -keystore "$RUNNER_TEMP/tmp.jks" -storetype PKCS12 -alias tmp -keyalg RSA \
            -keysize 2048 -validity 2 -storepass tmppass -keypass tmppass -dname CN=throwaway >/dev/null 2>&1
          printf 'storeFile=%s\nstorePassword=tmppass\nkeyAlias=tmp\nkeyPassword=tmppass\n' "$RUNNER_TEMP/tmp.jks" > android/key.properties
          { flutter pub get && flutter build apk --release --split-per-abi --target-platform android-arm64 \
              --build-name "$BN" --build-number "$BNUM"; } 2>&1 | tee build-android.log
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "finamp-sdm-$BN-arm64-tmpsigned.apk"
      - name: Status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.tests.outcome }}" = success ] && [ "${{ steps.build.outcome }}" = success ]; then
            echo success > android-status.txt
          else
            echo "failed: tests=${{ steps.tests.outcome }} build=${{ steps.build.outcome }}" > android-status.txt
          fi
          { echo "=== analyze + tests"; cat sdm-tests.log 2>/dev/null || true; echo "=== build"; cat build-android.log 2>/dev/null || true; } > all.log
          tail -c 300000 all.log > build-android.log
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          name: Finamp SDM ${{ github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            finamp-sdm-*-arm64-tmpsigned.apk
            build-android.log
            android-status.txt

  windows:
    needs: android
    if: needs.android.outputs.ok == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust (for smtc_windows)
        uses: hecrj/setup-rust-action@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: |
          $ver = (Get-Content .sdm/build.json -Raw | ConvertFrom-Json).build_name
          $zip = "finamp-sdm-$ver-windows-x64.zip"
          Set-Content -Path build/windows/x64/runner/Release/sdm-version.txt -Value $ver -Encoding ascii
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $zip
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
          "ZIP=$zip" >> $env:GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          name: Finamp SDM ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
